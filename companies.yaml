# Target companies checked once a day.
# ats: workday   -> tenant, wd, site taken from the company's myworkdayjobs.com URL
#      greenhouse -> board  (job-boards.greenhouse.io/<board>)
#      lever      -> site   (jobs.lever.co/<site>; region: eu for jobs.eu.lever.co)
#      oracle     -> host, site (Oracle Recruiting Cloud), optional job_url template
#      eightfold  -> domain, hosts (tried in order)
#      apple      -> jobs.apple.com; optional teams (team codes) and allow_ams_dv
# Optional: terms (search words), max_pages (default 5).
#
# Qualcomm: its Workday search returns nothing publicly and careers.qualcomm.com
# disallows automated access in robots.txt, so it is left to LinkedIn alerts.
#
# Not covered here (their sites only show jobs in a browser): Infineon, Skyworks,
# Qorvo, Renesas, onsemi, MediaTek, Samsung, AMD, Synopsys, Qualcomm. The evening
# browser sweep on Zayle's computer and LinkedIn alerts cover these.

- name: Apple
  ats: apple
  # Apple's search covers the whole posting, so roles titled "Power Management",
  # "SerDes" or "PLL" without the word analog still come up.
  terms: ["transistor", "mixed-signal", "PMIC", "PMU", "LDO", "buck", "SerDes",
          "PLL", "RFIC", "ADC"]
  teams: [HRDWR]          # Hardware
  allow_ams_dv: true      # keep analog / mixed-signal verification and modeling roles
  max_pages: 12

- name: Texas Instruments
  ats: oracle
  host: https://edbz.fa.us2.oraclecloud.com
  site: CX
  job_url: https://careers.ti.com/job/{id}
  max_pages: 8

- name: Analog Devices
  ats: workday
  tenant: analogdevices
  wd: wd1
  site: External
  # "analog" matches every ADI posting (it is in the company name), so search narrower words
  terms: ["analog design", "mixed signal", "IC design", "circuit design", "power management",
          "data converter", "new college", "university graduate", "associate engineer"]
  max_pages: 10

