# Target companies checked once a day.
# ats: workday   -> tenant, wd, site taken from the company's myworkdayjobs.com URL
#      greenhouse -> board  (job-boards.greenhouse.io/<board>)
#      lever      -> site   (jobs.lever.co/<site>; region: eu for jobs.eu.lever.co)
# Optional: terms (search words), max_pages (20 results per page, default 5).
#
# Not covered yet (no public endpoint found, or not checked): TI, Apple, Infineon,
# Skyworks, Qorvo, Renesas, onsemi, MediaTek, Samsung, AMD, Synopsys. LinkedIn
# alerts and Handshake still cover these.

- name: Analog Devices
  ats: workday
  tenant: analogdevices
  wd: wd1
  site: External
  # "analog" matches every ADI posting (it is in the company name), so search narrower words
  terms: ["analog design", "mixed signal", "IC design", "circuit design", "power management",
          "data converter", "new college", "university graduate", "associate engineer"]
  max_pages: 10

