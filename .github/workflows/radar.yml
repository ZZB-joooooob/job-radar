name: radar

on:
  schedule:
    # 23:30 UTC = 3:30 pm PST / 4:30 pm PDT, ahead of the 5:40 pm triage
    - cron: "30 23 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - radar.py
      - companies.yaml
      - requirements.txt
      - .github/workflows/radar.yml

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          # always start from the latest main, so a queued run sees the previous run's data
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Check career sites
        run: python radar.py

      - name: Save results
        run: |
          git config user.name "job-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "radar: $(TZ=America/Los_Angeles date +%F) [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
